name: Build and Deploy HRDesk

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Build WAR with Gradle
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hrdesk:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/hrdesk:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/hrdesk:latest
            docker stop hrdesk || true
            docker rm hrdesk || true
            docker run -d --name hrdesk --restart unless-stopped -p 80:8080 \
              -e DB_URL='${{ secrets.DB_URL }}' \
              -e DB_USER='${{ secrets.DB_USER }}' \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e MAIL_HOST='${{ secrets.MAIL_HOST }}' \
              -e MAIL_USER='${{ secrets.MAIL_USER }}' \
              -e MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}' \
              ${{ secrets.DOCKER_USERNAME }}/hrdesk:latest
